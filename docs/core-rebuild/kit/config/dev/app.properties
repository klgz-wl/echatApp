app.namespace=com.vexora.app
core.namespace=com.zorv.core
sdk.compile=36
sdk.minor=1
sdk.min=24
sdk.target=36
app.version.code=1
app.version.name=1.0.0
# 仅 Debug 设计预览使用；正式 A/B 由 AppsFlyer 归因确定
build.string.DESIGN_PREVIEW_MODE=A
# 首次归因最长等待时间，单位毫秒
build.int.ATTRIBUTION_TIMEOUT_MS=5000
build.int.ATTRIBUTION_RETRY_ATTEMPTS=10
build.int.ATTRIBUTION_RETRY_INTERVAL_MS=5000
build.int.ATTRIBUTION_CACHE_WAIT_MS=200
build.int.STARTUP_TIMEOUT_MS=30000
build.string.STORAGE_NAME=vexora_preferences
build.string.DATABASE_NAME=vexora_database
build.int.USERNAME_MIN_LENGTH=3
build.int.USERNAME_MAX_LENGTH=50
build.int.PASSWORD_MIN_LENGTH=6
build.int.PASSWORD_MAX_LENGTH=32
build.string.ABOUT_URL=file:///android_asset/web/about.html
build.string.CONTACT_URL=file:///android_asset/web/contact.html
build.int.NETWORK_TIMEOUT_SECONDS=30
build.string.WALLET_PRODUCT_TYPE=diamond
build.string.WALLET_PRODUCT_LOCATION=store
build.int.WALLET_PAGE_SIZE=20
build.string.BILLING_STORAGE_NAME=vexora_billing_pending_purchases
build.string.PURCHASE_TRIGGER=profile_page
build.int.RECHARGE_RETRY_INITIAL_MS=1000
build.int.RECHARGE_RETRY_MAX_MS=30000
build.int.RECHARGE_FIRST_MESSAGE_TIMEOUT_MS=10000
build.int.RECHARGE_IDLE_TIMEOUT_MS=60000
build.int.RECHARGE_CHECK_INTERVAL_MS=5000
build.int.RECHARGE_DEDUPE_WINDOW_MS=3000

# 视觉生成接口的首页来源及分页，独立于 A/B 模式
build.string.HOME_TEMPLATE_MODALITY=VIDEO
build.int.VISUAL_PAGE_SIZE=20

# 视觉生成私有请求与上传限制，单位字节
build.string.GENERATION_STORAGE_DIRECTORY=visual_generation
build.int.GENERATION_MAX_IMAGE_BYTES=20971520

# 前台任务轮询；服务端建议间隔夹在以下范围内
build.int.VISUAL_POLL_DEFAULT_SECONDS=5
build.int.VISUAL_POLL_MIN_SECONDS=2
build.int.VISUAL_POLL_MAX_SECONDS=60

# 用户确认的 Vexora 联系邮箱，由设置菜单与联系页面共享
build.string.CONTACT_EMAIL=dinhducfvuirut3756@gmail.com

# 第三方支付：前台查询、成功提示与有界事件重试
build.string.PAYMENT_STORAGE_NAME=vexora_payments
build.int.PAYMENT_POLL_INTERVAL_SECONDS=10
build.int.PAYMENT_POLL_MAX_SECONDS=600
build.int.PAYMENT_SUCCESS_DISPLAY_MS=3000
build.int.PAYMENT_EVENT_LIMIT=100
build.int.PAYMENT_EVENT_ATTEMPTS=3
build.int.PAYMENT_EVENT_RETRY_MS=5000

# 新购买入口：SERVICE 为服务端分流，LEGACY 为参考 Google Play 流程；可在 flavor 配置覆盖。
build.string.PAYMENT_FLOW=LEGACY

# 业务埋点：后台会话结束阈值、内存队列及本地去重记录上限
build.boolean.ENABLE_BACKEND_ANALYTICS=true
build.string.ANALYTICS_STORAGE_NAME=vexora_analytics
build.int.ANALYTICS_BACKGROUND_TIMEOUT_MS=30000
build.int.ANALYTICS_QUEUE_CAPACITY=256
build.int.ANALYTICS_DEDUPE_LIMIT=10000

# prod release 地区限制；默认 SIM、系统地区及出口 IP 任一命中即拦截
build.string.BLOCKED_REGION_CODES=CN,TW,MO,HK,SG,MY
build.int.REGION_LOOKUP_TIMEOUT_MS=10000
# 首次查询失败后额外重试 5 次，最多 6 次；每次失败后间隔 1 秒
build.int.REGION_LOOKUP_RETRY_ATTEMPTS=5
build.int.REGION_LOOKUP_RETRY_DELAY_MS=1000

# 仅输出 AppsFlyer 启动阶段、数字错误码及归因有效性，不输出 SDK 载荷
build.boolean.APPSFLYER_DIAGNOSTIC_LOGGING=false
